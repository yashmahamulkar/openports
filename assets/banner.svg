<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="word" x1="80" y1="150" x2="520" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <circle cx="980" cy="200" r="320" fill="url(#glow)"/>

  <!-- faint port-grid motif -->
  <g stroke="#1c2740" stroke-width="1">
    <line x1="0" y1="100" x2="1280" y2="100"/>
    <line x1="0" y1="300" x2="1280" y2="300"/>
  </g>

  <!-- left: wordmark -->
  <g transform="translate(80, 150)">
    <!-- magnifier + bolt mark -->
    <g transform="translate(0,-8)">
      <circle cx="22" cy="22" r="20" stroke="#22d3ee" stroke-width="6" fill="none"/>
      <line x1="37" y1="37" x2="54" y2="54" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
      <path d="M24 11 L13 25 L22 25 L18 35 L31 20 L22 20 Z" fill="#4ade80"/>
    </g>
    <text x="78" y="34" font-size="58" font-weight="800" fill="url(#word)" letter-spacing="-1">openports</text>
    <text x="80" y="78" font-size="23" font-weight="500" fill="#c9d4e3">Lightning-fast port scanner &amp; process manager</text>

    <g transform="translate(80, 108)">
      <rect x="0" y="0" width="290" height="40" rx="8" fill="#11182a" stroke="#243049"/>
      <text x="16" y="26" font-size="18" fill="#5b6b86" font-family="'Cascadia Code','Consolas',monospace">$</text>
      <text x="34" y="26" font-size="18" fill="#e6edf6" font-family="'Cascadia Code','Consolas',monospace">pip install openports</text>
    </g>

    <g transform="translate(80, 168)" font-size="15" fill="#7d8aa3">
      <text x="0" y="0">▸ JSON / CSV output</text>
      <text x="170" y="0">▸ kill by port</text>
      <text x="300" y="0">▸ cross-platform</text>
    </g>
  </g>

  <!-- right: terminal window -->
  <g transform="translate(740, 92)" filter="url(#soft)">
    <rect width="460" height="216" rx="14" fill="#0f1626" stroke="#243049"/>
    <rect width="460" height="38" rx="14" fill="#161f33"/>
    <rect y="20" width="460" height="18" fill="#161f33"/>
    <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
    <circle cx="46" cy="19" r="6" fill="#ffbd2e"/>
    <circle cx="68" cy="19" r="6" fill="#27c93f"/>
    <text x="230" y="24" text-anchor="middle" font-size="13" fill="#6b7a96" font-family="'Cascadia Code','Consolas',monospace">openports</text>

    <g font-family="'Cascadia Code','Consolas',monospace" font-size="15">
      <text x="22" y="66" fill="#4ade80">$</text>
      <text x="40" y="66" fill="#e6edf6">openports</text>

      <g fill="#7d8aa3" font-size="13">
        <text x="22" y="98">PORT</text>
        <text x="85" y="98">PROCESS</text>
        <text x="250" y="98">PID</text>
        <text x="330" y="98">STATUS</text>
      </g>

      <text x="22" y="124" fill="#4ade80" font-weight="700">3000</text>
      <text x="85" y="124" fill="#c9d4e3">node.exe</text>
      <text x="250" y="124" fill="#fbbf24">26024</text>
      <text x="330" y="124" fill="#22d3ee">LISTENING</text>

      <text x="22" y="150" fill="#c084fc">5432</text>
      <text x="85" y="150" fill="#c9d4e3">postgres</text>
      <text x="250" y="150" fill="#fbbf24">812</text>
      <text x="330" y="150" fill="#22d3ee">LISTENING</text>

      <text x="22" y="176" fill="#c084fc">8080</text>
      <text x="85" y="176" fill="#c9d4e3">python</text>
      <text x="250" y="176" fill="#fbbf24">4471</text>
      <text x="330" y="176" fill="#22d3ee">LISTENING</text>

      <rect x="22" y="190" width="9" height="16" fill="#4ade80">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
